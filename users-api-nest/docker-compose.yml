services:
  postgres:
    image: postgres:16-alpine
    container_name: nestjs-auth-api-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nestjs_auth
      POSTGRES_USER: nestjs_auth
      POSTGRES_PASSWORD: nestjs_auth
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nestjs_auth -d nestjs_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
